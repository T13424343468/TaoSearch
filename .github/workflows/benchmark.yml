name: benchmark

on:
  workflow_dispatch:
  push:
    branches: ['bench/**']

jobs:
  real-volume-bench:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore TaoSearch.Kernel.slnx

      - name: 编译（零错零警口径）
        run: dotnet build TaoSearch.Kernel.slnx -c Release --no-restore --nologo

      - name: 真实卷基准（仅 Benchmark 类：扫 C 盘卷 + 20 条查询集 P50/P95）
        run: >
          dotnet test TaoSearch.Kernel.slnx -c Release --no-build --nologo
          --filter "Category=Benchmark"
          --logger "trx;LogFileName=taosearch-bench.trx" --results-directory "D:\taosearch-bench"

      - name: 上传基准证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: D:\taosearch-bench\**
          if-no-files-found: warn
          retention-days: 14
