name: m1-pack

on:
  workflow_dispatch:
  push:
    branches: [ 'pack/**' ]

jobs:
  pack-baseline:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 WiX 6.0.2（打包工具，仅 CI 用，版本与用户机对齐）
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          # wix extension add 按 id/version 形式会静默失败(退出码恒 0, 缓存残缺), 改为下载带版本文件名的 nupkg 安装
          $dl = Join-Path $env:TEMP "wixext"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/wixtoolset.bal.wixext/6.0.2/wixtoolset.bal.wixext.6.0.2.nupkg" -OutFile (Join-Path $dl "WixToolset.Bal.wixext.6.0.2.nupkg")
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/wixtoolset.util.wixext/6.0.2/wixtoolset.util.wixext.6.0.2.nupkg" -OutFile (Join-Path $dl "WixToolset.Util.wixext.6.0.2.nupkg")
          wix extension add -g (Join-Path $dl "WixToolset.Bal.wixext.6.0.2.nupkg")
          wix extension add -g (Join-Path $dl "WixToolset.Util.wixext.6.0.2.nupkg")
          # 扩展安装自检: wix extension add 失败不报错, 必须显式核对缓存 dll 落位
          $balDll = "$env:USERPROFILE\.wix\extensions\WixToolset.Bal.wixext\6.0.2\wixext6\WixToolset.Bal.wixext.dll"
          $utilDll = "$env:USERPROFILE\.wix\extensions\WixToolset.Util.wixext\6.0.2\wixext6\WixToolset.Util.wixext.dll"
          if (-not (Test-Path $balDll)) { Write-Host "::error::Bal 扩展缓存缺失"; exit 1 }
          if (-not (Test-Path $utilDll)) { Write-Host "::error::Util 扩展缓存缺失"; exit 1 }
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          if (-not (Test-Path $wix)) { Write-Host "::error::wix 未找到"; exit 1 }
          "WIXEXE=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 发布框架依赖产物（不内置运行时，按 2026-11-21 新标准装时联网补）
        shell: pwsh
        run: |
          dotnet publish src/TaoSearch.Service/TaoSearch.Service.csproj -c Release -r win-x64 --self-contained false -o installer/publish --nologo
          dotnet publish src/TaoSearch.App/TaoSearch.App.csproj -c Release -r win-x64 --self-contained false -o installer/publish --nologo
          $count = (Get-ChildItem installer/publish -Recurse -File | Measure-Object).Count
          if ($count -lt 2) { Write-Host "::error::发布产物异常偏少"; exit 1 }
          Write-Host "发布文件数: $count"

      - name: 构建 MSI + 引导安装器（微信风格 MSI + 运行时联网装）
        shell: pwsh
        run: |
          ./installer/msi/package.ps1 -PublishDir installer/publish -OutDir artifacts/installer -WixExe "$env:WIXEXE"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::安装器构建失败"; exit 1 }

      - name: 模拟安装验证（静默装→验文件注册表→启动→卸载干净，四步留痕）
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts/installer/TaoSearch-*.exe | Select-Object -First 1
          ./installer/msi/verify-install.ps1 -InstallerExe $exe.FullName -InstallDir "C:\Program Files\TaoSearch"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::模拟安装验证失败"; exit 1 }

      - name: 包体基线两口径实测
        shell: pwsh
        run: |
          $fd = (Get-ChildItem installer/publish -Recurse | Measure-Object Length -Sum).Sum
          $msi = (Get-ChildItem artifacts/installer/*.msi | Select-Object -First 1).Length
          $bundle = (Get-ChildItem artifacts/installer/TaoSearch-*.exe | Select-Object -First 1).Length
          "框架依赖 publish: {0:N1} MB" -f ($fd/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt
          "产品 MSI:        {0:N1} MB" -f ($msi/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt -Append
          "引导安装器:      {0:N1} MB（不内置运行时）" -f ($bundle/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt -Append
          Get-Content artifacts\pack-baseline.txt

      - name: 上传安装器与验证证据
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            artifacts/installer/*.msi
            artifacts/installer/TaoSearch-*.exe
            verify-install.log
            artifacts/pack-baseline.txt
          if-no-files-found: error
          retention-days: 14
