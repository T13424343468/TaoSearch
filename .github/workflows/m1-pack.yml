name: m1-pack

on:
  workflow_dispatch:
  push:
    branches: [ 'pack/**' ]

jobs:
  pack-baseline:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 WiX 6.0.2（打包工具，仅 CI 用，版本与用户机对齐）
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          if (-not (Test-Path $wix)) { Write-Host "::error::wix 未找到"; exit 1 }
          "WIXEXE=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 解包 WiX 扩展（Bal/Util，直接全路径引用，不依赖 wix extension add 缓存）
        shell: pwsh
        run: |
          $dl = Join-Path $env:RUNNER_TEMP "wixext"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/wixtoolset.bal.wixext/6.0.2/wixtoolset.bal.wixext.6.0.2.nupkg" -OutFile (Join-Path $dl "bal.zip")
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/wixtoolset.util.wixext/6.0.2/wixtoolset.util.wixext.6.0.2.nupkg" -OutFile (Join-Path $dl "util.zip")
          Expand-Archive (Join-Path $dl "bal.zip") -DestinationPath (Join-Path $dl "bal") -Force
          Expand-Archive (Join-Path $dl "util.zip") -DestinationPath (Join-Path $dl "util") -Force
          $balDll = Join-Path $dl "bal\wixext6\WixToolset.BootstrapperApplications.wixext.dll"
          $utilDll = Join-Path $dl "util\wixext6\WixToolset.Util.wixext.dll"
          if (-not (Test-Path $balDll)) { Write-Host "::error::Bal 扩展 dll 缺失"; exit 1 }
          if (-not (Test-Path $utilDll)) { Write-Host "::error::Util 扩展 dll 缺失"; exit 1 }
          "BALEXT=$balDll" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UTILEXT=$utilDll" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 发布框架依赖产物（不内置运行时，按 2026-11-21 新标准装时联网补）
        shell: pwsh
        run: |
          dotnet publish src/TaoSearch.Service/TaoSearch.Service.csproj -c Release -r win-x64 --self-contained false -o installer/publish --nologo
          dotnet publish src/TaoSearch.App/TaoSearch.App.csproj -c Release -r win-x64 --self-contained false -o installer/publish --nologo
          $count = (Get-ChildItem installer/publish -Recurse -File | Measure-Object).Count
          if ($count -lt 2) { Write-Host "::error::发布产物异常偏少"; exit 1 }
          Write-Host "发布文件数: $count"

      - name: 预取官方运行时安装包（仅构建期取元数据，Compressed=no 不进安装器）
        shell: pwsh
        run: |
          $rt = Join-Path $env:RUNNER_TEMP "runtimes"
          New-Item -ItemType Directory -Path $rt -Force | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/dotnet/10.0/windowsdesktop-runtime-win-x64.exe" -OutFile (Join-Path $rt "windowsdesktop-runtime-win-x64.exe")
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe" -OutFile (Join-Path $rt "windowsappruntimeinstall-x64.exe")
          Get-ChildItem $rt | ForEach-Object { Write-Host ("  {0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB)) }
          "RUNTIMEDIR=$rt" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 构建 MSI + 引导安装器（微信风格 MSI + 运行时联网装）
        shell: pwsh
        run: |
          ./installer/msi/package.ps1 -PublishDir installer/publish -OutDir artifacts/installer -WixExe "$env:WIXEXE" -BalExtPath "$env:BALEXT" -UtilExtPath "$env:UTILEXT" -RuntimeDir "$env:RUNTIMEDIR"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::安装器构建失败"; exit 1 }

      - name: 对照实验（装前直接运行发布产物，隔离安装器载荷与应用/环境问题）
        shell: pwsh
        run: |
          Write-Host "发布产物顶层文件:"
          Get-ChildItem installer/publish -File | ForEach-Object { Write-Host ("  {0}  {1:N0} 字节" -f $_.Name, $_.Length) }
          ./installer/msi/diag-app.ps1 -ExePath installer/publish/TaoSearch.App.exe -WorkingDir installer/publish -Start

      - name: 清单变体矩阵实验（定位 SxS 触发源：清单内容 / 清单嵌入 / WinUI3 因素）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = "variants"
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          # V5 对照组: Service 无清单 apphost 直接启动 (区分"清单问题"与"apphost/环境问题")
          ./installer/msi/diag-app.ps1 -ExePath installer/publish/TaoSearch.Service.exe -Start

          # V0: 最小控制台应用 + 同一份清单 (隔离 WinUI3 因素)
          $v0 = Join-Path $root "v0"
          New-Item -ItemType Directory -Path $v0 -Force | Out-Null
          Copy-Item src/TaoSearch.App/app.manifest (Join-Path $v0 "app.manifest")
          $csprojLines = @(
            '<Project Sdk="Microsoft.NET.Sdk">'
            '  <PropertyGroup>'
            '    <OutputType>Exe</OutputType>'
            '    <TargetFramework>net10.0-windows10.0.26100.0</TargetFramework>'
            '    <RuntimeIdentifiers>win-x64</RuntimeIdentifiers>'
            '    <ApplicationManifest>app.manifest</ApplicationManifest>'
            '  </PropertyGroup>'
            '</Project>'
          )
          [System.IO.File]::WriteAllLines((Join-Path $v0 "ManifestProbe.csproj"), $csprojLines)
          'System.Console.WriteLine("probe ok");' | Out-File (Join-Path $v0 "Program.cs") -Encoding utf8
          dotnet publish (Join-Path $v0 "ManifestProbe.csproj") -c Release -r win-x64 --self-contained false -o "$root/v0-out" --nologo
          ./installer/msi/diag-app.ps1 -ExePath "$root/v0-out/ManifestProbe.exe" -Start

          # V2: 无清单发布 (隔离清单嵌入因素)
          dotnet publish src/TaoSearch.App/TaoSearch.App.csproj -c Release -r win-x64 --self-contained false -o "$root/v2-out" -p:ApplicationManifest= --nologo
          ./installer/msi/diag-app.ps1 -ExePath "$root/v2-out/TaoSearch.App.exe" -Start

          # V3: VS 标准风格清单 (trustInfo + compatibility + windowsSettings)
          $v3m = Join-Path $root "vs-style.manifest"
          $v3Lines = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            '<assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1">'
            '  <assemblyIdentity version="1.0.0.0" name="TaoSearch.App"/>'
            '  <trustInfo xmlns="urn:schemas-microsoft-com:asm.v2">'
            '    <security>'
            '      <requestedPrivileges xmlns="urn:schemas-microsoft-com:asm.v3">'
            '        <requestedExecutionLevel level="asInvoker" uiAccess="false" />'
            '      </requestedPrivileges>'
            '    </security>'
            '  </trustInfo>'
            '  <compatibility xmlns="urn:schemas-microsoft-com:compatibility.v1">'
            '    <application>'
            '      <supportedOS Guid="{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}" />'
            '    </application>'
            '  </compatibility>'
            '  <application xmlns="urn:schemas-microsoft-com:asm.v3">'
            '    <windowsSettings>'
            '      <dpiAwareness xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">PerMonitorV2</dpiAwareness>'
            '    </windowsSettings>'
            '  </application>'
            '</assembly>'
          )
          [System.IO.File]::WriteAllLines($v3m, $v3Lines)
          dotnet publish src/TaoSearch.App/TaoSearch.App.csproj -c Release -r win-x64 --self-contained false -o "$root/v3-out" -p:ApplicationManifest=$v3m --nologo
          ./installer/msi/diag-app.ps1 -ExePath "$root/v3-out/TaoSearch.App.exe" -Start

          # V4: 原清单 + assemblyIdentity 补 type="win32"
          $v4m = Join-Path $root "typed.manifest"
          (Get-Content src/TaoSearch.App/app.manifest -Raw) -replace '<assemblyIdentity version="1.0.0.0" name="TaoSearch.App"/>', '<assemblyIdentity type="win32" version="1.0.0.0" name="TaoSearch.App"/>' | Out-File $v4m -Encoding utf8
          dotnet publish src/TaoSearch.App/TaoSearch.App.csproj -c Release -r win-x64 --self-contained false -o "$root/v4-out" -p:ApplicationManifest=$v4m --nologo
          ./installer/msi/diag-app.ps1 -ExePath "$root/v4-out/TaoSearch.App.exe" -Start

      - name: 模拟安装验证（静默装→验文件注册表→启动→卸载干净，四步留痕）
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts/installer/TaoSearch-*.exe | Select-Object -First 1
          # 用独特路径验证 Burn 变量→MSI 属性→安装目录的覆盖链路 (与 x64 默认目录 C:\Program Files\TaoSearch 可区分)
          ./installer/msi/verify-install.ps1 -InstallerExe $exe.FullName -InstallDir "C:\TaoSearchVerify" -PublishDir installer/publish
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::模拟安装验证失败"; exit 1 }

      - name: 包体基线两口径实测
        shell: pwsh
        run: |
          $fd = (Get-ChildItem installer/publish -Recurse | Measure-Object Length -Sum).Sum
          $msi = (Get-ChildItem artifacts/installer/*.msi | Select-Object -First 1).Length
          $bundle = (Get-ChildItem artifacts/installer/TaoSearch-*.exe | Select-Object -First 1).Length
          "框架依赖 publish: {0:N1} MB" -f ($fd/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt
          "产品 MSI:        {0:N1} MB" -f ($msi/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt -Append
          "引导安装器:      {0:N1} MB（不内置运行时）" -f ($bundle/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt -Append
          Get-Content artifacts\pack-baseline.txt

      - name: 上传安装器与验证证据
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            artifacts/installer/*.msi
            artifacts/installer/TaoSearch-*.exe
            verify-install.log
            burn-install.log
            sxs-trace.txt
            sxs-trace.etl
            artifacts/pack-baseline.txt
          if-no-files-found: error
          retention-days: 14
