name: m1-pack

on:
  workflow_dispatch:
  push:
    branches: [ 'pack/**' ]

jobs:
  pack-baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 获取 makeappx（微软官方 SDK 工具包按需取用，仅 CI 用不进产品依赖）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".sdktool" | Out-Null
          Set-Content ".sdktool\tool.csproj" '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework><OutputType>Library</OutputType></PropertyGroup><ItemGroup><PackageReference Include="Microsoft.Windows.SDK.BuildTools" Version="10.0.*" /></ItemGroup></Project>'
          dotnet restore ".sdktool\tool.csproj" --nologo
          $global = (dotnet nuget locals global-packages --list) -replace "^global-packages:\s*",""
          Write-Host "NuGet 全局包目录：$global"
          $makeappx = Get-ChildItem $global -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if (-not $makeappx) { Write-Host "::error::makeappx 获取失败"; exit 1 }
          Write-Host "makeappx: $($makeappx.FullName)"
          "MAKEAPPX=$($makeappx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 占位图标（清单引用需要）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts\msix\assets" | Out-Null
          $png = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==")
          [System.IO.File]::WriteAllBytes("artifacts\msix\assets\logo.png", $png)

      - name: 打包未签名 MSIX（框架依赖 win-x64）
        shell: pwsh
        run: ./scripts/pack-msix.ps1 -MakeAppxPath "$env:MAKEAPPX"

      - name: 包体基线三口径实测
        shell: pwsh
        run: |
          dotnet publish src/TaoSearch.Service/TaoSearch.Service.csproj -c Release -r win-x64 --self-contained true -o artifacts\selfcontained --nologo
          $fd = (Get-ChildItem artifacts\msix\publish -Recurse | Measure-Object Length -Sum).Sum
          $sc = (Get-ChildItem artifacts\selfcontained -Recurse | Measure-Object Length -Sum).Sum
          $msix = (Get-ChildItem artifacts\msix\*unsigned.msix | Select-Object -First 1).Length
          "框架依赖 publish: {0:N1} MB" -f ($fd/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt
          "自包含 publish:   {0:N1} MB" -f ($sc/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt -Append
          "未签名 MSIX:      {0:N1} MB" -f ($msix/1MB) | Tee-Object -FilePath artifacts\pack-baseline.txt -Append
          Get-Content artifacts\pack-baseline.txt

      - name: 上传包体基线证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-baseline
          path: |
            artifacts/msix/*.msix
            artifacts/pack-baseline.txt
          if-no-files-found: warn
          retention-days: 14
