name: windows-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore TaoSearch.Kernel.slnx

      - name: 编译（零错零警口径，TreatWarningsAsErrors 已在 Directory.Build.props）
        run: dotnet build TaoSearch.Kernel.slnx -c Release --no-restore --nologo

      # 壳层（TaoSearch.App，WinUI3）：独立还原+编译，红灯不掩，修红见 XamlCompiler 诊断步
      - name: 编译壳层（WinUI3，Windows 专属目标框架；独立还原避免 slnx 遗漏）
        run: dotnet build src/TaoSearch.App/TaoSearch.App.csproj -c Release --nologo

      - name: 壳层编译诊断（失败时导出 XamlCompiler 产物）
        if: failure()
        run: |
          if (Test-Path src/TaoSearch.App/obj) {
            Get-ChildItem -Recurse src/TaoSearch.App/obj -Filter *.json | ForEach-Object { "=== $($_.FullName) ==="; Get-Content $_.FullName -Raw }
          }

      - name: 单元测试（Windows 真环境跑 MFT/USN 互操作编译产物）
        run: >
          dotnet test TaoSearch.Kernel.slnx -c Release --no-build --nologo
          --filter "Category!=Benchmark" --logger "trx;LogFileName=taosearch-tests.trx" --results-directory "D:\taosearch-test-results"

      - name: 上传测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: D:\taosearch-test-results\**
          if-no-files-found: warn
          retention-days: 14
