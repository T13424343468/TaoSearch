name: windows-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore TaoSearch.Kernel.slnx

      - name: 编译（零错零警口径，TreatWarningsAsErrors 已在 Directory.Build.props）
        run: dotnet build TaoSearch.Kernel.slnx -c Release --no-restore --nologo

      # 壳层（TaoSearch.App，WinUI3）：独立还原+编译，红灯不掩，修红见 XamlCompiler 诊断步
      - name: 编译壳层（WinUI3，Windows 专属目标框架；独立还原避免 slnx 遗漏）
        run: dotnet build src/TaoSearch.App/TaoSearch.App.csproj -c Release -p:Platform=x64 --nologo

      - name: 壳层编译诊断（失败时手动重跑 XamlCompiler 抓真实报错）
        if: failure()
        shell: pwsh
        run: |
          $objdir = "src/TaoSearch.App/obj/Release/net10.0-windows10.0.26100.0"
          if (Test-Path "$objdir/input.json") {
            Write-Host "input.json bytes: $((Get-Item "$objdir/input.json").Length)"
          }
          $xc = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk" -Recurse -Filter XamlCompiler.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($xc -and (Test-Path "$objdir/input.json")) {
            Write-Host "===== 手动重跑 XamlCompiler.exe ====="
            Write-Host "exe: $($xc.FullName)"
            Push-Location src/TaoSearch.App
            & $xc.FullName "obj/Release/net10.0-windows10.0.26100.0/input.json" "obj/Release/net10.0-windows10.0.26100.0/output-manual.json" 2>&1 | ForEach-Object { Write-Host $_ }
            Write-Host "exit code: $LASTEXITCODE"
            Pop-Location
            if (Test-Path "$objdir/output-manual.json") { Write-Host "===== output-manual.json ====="; Get-Content "$objdir/output-manual.json" -Raw }
          } else {
            Write-Host "XamlCompiler.exe 或 input.json 未找到，跳过手动重跑"
          }
          if (Test-Path src/TaoSearch.App/obj) {
            Get-ChildItem -Recurse src/TaoSearch.App/obj -Include output.json,XamlSaveStateFile.xml -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.FullName) ==="; Get-Content $_.FullName -Raw }
          }

      - name: 单元测试（Windows 真环境跑 MFT/USN 互操作编译产物）
        run: >
          dotnet test TaoSearch.Kernel.slnx -c Release --no-build --nologo
          --filter "Category!=Benchmark" --logger "trx;LogFileName=taosearch-tests.trx" --results-directory "D:\taosearch-test-results"
          --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type mini

      - name: 分支覆盖出账（coverlet，测试规范九.11 第一根钉子：工具出账不许口头报数）
        run: >
          dotnet test TaoSearch.Kernel.slnx -c Release --no-build --nologo
          --filter "Category!=Benchmark"
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory "D:\taosearch-coverage"

      - name: 上传测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            D:\taosearch-test-results\**
            D:\taosearch-coverage\**
          if-no-files-found: warn
          retention-days: 14
