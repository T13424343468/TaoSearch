name: windows-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore TaoSearch.Kernel.slnx

      - name: 编译（零错零警口径，TreatWarningsAsErrors 已在 Directory.Build.props）
        run: dotnet build TaoSearch.Kernel.slnx -c Release --no-restore --nologo

      # 壳层（TaoSearch.App，WinUI3）：独立还原+编译，红灯不掩，修红见 XamlCompiler 诊断步
      - name: 编译壳层（WinUI3，Windows 专属目标框架；独立还原避免 slnx 遗漏）
        run: dotnet build src/TaoSearch.App/TaoSearch.App.csproj -c Release -p:Platform=x64 --nologo

      - name: 壳层编译诊断（失败时手动重跑 XamlCompiler 抓真实报错）
        if: failure()
        shell: pwsh
        run: |
          $objdir = "src/TaoSearch.App/obj/Release/net10.0-windows10.0.26100.0"
          if (Test-Path "$objdir/input.json") {
            Write-Host "input.json bytes: $((Get-Item "$objdir/input.json").Length)"
          }
          $xc = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk" -Recurse -Filter XamlCompiler.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($xc -and (Test-Path "$objdir/input.json")) {
            Write-Host "===== 手动重跑 XamlCompiler.exe ====="
            Write-Host "exe: $($xc.FullName)"
            Push-Location src/TaoSearch.App
            & $xc.FullName "obj/Release/net10.0-windows10.0.26100.0/input.json" "obj/Release/net10.0-windows10.0.26100.0/output-manual.json" 2>&1 | ForEach-Object { Write-Host $_ }
            Write-Host "exit code: $LASTEXITCODE"
            Pop-Location
            if (Test-Path "$objdir/output-manual.json") { Write-Host "===== output-manual.json ====="; Get-Content "$objdir/output-manual.json" -Raw }
          } else {
            Write-Host "XamlCompiler.exe 或 input.json 未找到，跳过手动重跑"
          }
          if (Test-Path src/TaoSearch.App/obj) {
            Get-ChildItem -Recurse src/TaoSearch.App/obj -Include output.json,XamlSaveStateFile.xml -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.FullName) ==="; Get-Content $_.FullName -Raw }
          }

      - name: 单元测试（Windows 真环境跑 MFT/USN 互操作编译产物；真卷用例在本步实跑出账）
        run: >
          dotnet test TaoSearch.Kernel.slnx -c Release --no-build --nologo
          --filter "Category!=Benchmark" --logger "trx;LogFileName=taosearch-tests.trx" --results-directory "D:\taosearch-test-results"
          --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type mini

      - name: 分支覆盖出账（coverlet，测试规范九.11 第一根钉子：工具出账不许口头报数）
        run: >
          dotnet test TaoSearch.Kernel.slnx -c Release --no-build --nologo
          --filter "Category!=Benchmark"
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory "coverage-results"

      - name: Program 进程级实测（控制台模式：首实例存活 + 单实例互斥体挡第二实例）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem "src/TaoSearch.Service/bin/Release/net10.0/TaoSearch.Service.exe" -ErrorAction Stop | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "D:\taosearch-test-results" | Out-Null
          $vol = "$env:TEMP\taosearch-procvol"
          New-Item -ItemType Directory -Force -Path $vol | Out-Null
          Set-Content -Path "$vol\sample.txt" -Value "hello"

          # G-P1：首实例（控制台模式）启动后存活
          $out1 = "D:\taosearch-test-results\svc-proc1.out.log"
          $err1 = "D:\taosearch-test-results\svc-proc1.err.log"
          $p1 = Start-Process -FilePath $exe.FullName -ArgumentList '--console', $vol -PassThru -RedirectStandardOutput $out1 -RedirectStandardError $err1
          Start-Sleep -Seconds 8
          $p1.Refresh()
          if ($p1.HasExited) {
            $o = Get-Content $out1 -Raw -ErrorAction SilentlyContinue; $e = Get-Content $err1 -Raw -ErrorAction SilentlyContinue
            throw "G-P1 首实例启动后 8 秒内退出（ExitCode=$($p1.ExitCode)）out=$o err=$e"
          }
          Write-Host "[PASS] G-P1 首实例存活（控制台模式，PID=$($p1.Id)）"

          # G-P2：第二实例被 Global 互斥体挡住，打印占用文案后自行退出
          $out2 = "D:\taosearch-test-results\svc-proc2.out.log"
          $p2 = Start-Process -FilePath $exe.FullName -ArgumentList '--console', $vol -PassThru -RedirectStandardOutput $out2 -RedirectStandardError "D:\taosearch-test-results\svc-proc2.err.log"
          $deadline = (Get-Date).AddSeconds(15)
          while (-not $p2.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 300; $p2.Refresh() }
          $p2.Refresh()
          if (-not $p2.HasExited) { Stop-Process -Id $p2.Id -Force; throw "G-P2 第二实例 15 秒内未退出（互斥体未挡）" }
          $log2 = Get-Content $out2 -Raw -ErrorAction SilentlyContinue
          if ($log2 -notmatch '单实例互斥体被占用') { throw "G-P2 第二实例退出原因不符：$log2" }
          Write-Host "[PASS] G-P2 第二实例被互斥体挡住自行退出"

          # G-P3：第二实例启动不影响首实例
          $p1.Refresh()
          if ($p1.HasExited) { throw "G-P3 第二实例启动后首实例意外退出" }
          Write-Host "[PASS] G-P3 首实例仍存活"

          Stop-Process -Id $p1.Id -Force -ErrorAction SilentlyContinue
          Write-Host "[PASS] G-P4 进程级实测收尾完成（日志随测试证据归档）"

      - name: 上传测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: D:\taosearch-test-results\**
          if-no-files-found: warn
          retention-days: 14

      - name: 上传覆盖账（cobertura，随全测台账交付）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-账
          path: coverage-results/**
          if-no-files-found: warn
          retention-days: 14
