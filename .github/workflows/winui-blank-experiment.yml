          }
          '@
          [System.IO.File]::WriteAllText("$dir/App.xaml.cs", $cs, (New-Object System.Text.UTF8Encoding($false)))
          $proj = ([System.IO.File]::ReadAllText("blank-app/template.csproj.txt") -f "", "")
          [System.IO.File]::WriteAllText("$dir/Blank.csproj", $proj, (New-Object System.Text.UTF8Encoding($false)))
          dotnet publish "$dir/Blank.csproj" -c Release -r win-x64 --self-contained false -o blank-h-out --nologo
