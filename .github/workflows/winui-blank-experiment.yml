          $proj = ([System.IO.File]::ReadAllText("blank-app/template.csproj.txt") -f "<DefaultLanguage>zh-CN</DefaultLanguage>", "")
          [System.IO.File]::WriteAllText("$dir/Blank.csproj", $proj, (New-Object System.Text.UTF8Encoding($false)))
          dotnet publish "$dir/Blank.csproj" -c Release -r win-x64 --self-contained false -o blank-e-out --nologo
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::变体E发布失败"; exit 1 }
          $p = Start-Process -FilePath "blank-e-out/Blank.exe" -WorkingDirectory "blank-e-out" -PassThru
          Start-Sleep -Seconds 10
          $alive = Get-Process -Name "Blank" -ErrorAction SilentlyContinue
          if ($alive) {
            $w = $alive | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            Write-Host "变体E: 进程存活, 窗口标题='$(if($w){$w.MainWindowTitle}else{''})'"
            Stop-Process -Name "Blank" -Force -ErrorAction SilentlyContinue
          } else { try { Write-Host ("变体E: 进程已退出, 退出码=" + $p.ExitCode) } catch { Write-Host "变体E: 进程已退出" } }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object {
            $msg = if ($_.Message) { ($_.Message -replace "\s+", " ") } else { "(无正文)" }
            if ($msg.Length -gt 300) { $msg = $msg.Substring(0, 300) }
            Write-Host ("  E事件[" + $_.TimeCreated.ToString("HH:mm:ss") + "][" + $_.ProviderName + "] " + $msg)
          }

      - name: 变体F 空白应用 + 图标(SetIcon)
        shell: pwsh
        run: |
          $dir = "blank-f"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item blank-app/App.xaml "$dir/App.xaml"
          New-Item -ItemType Directory -Path "$dir/Assets" -Force | Out-Null
          Copy-Item src/TaoSearch.App/Assets/taosearch.ico "$dir/Assets/taosearch.ico"
          $cs = @'
          using Microsoft.UI.Xaml;
          using Microsoft.UI.Xaml.Controls;

          namespace Blank;

          public partial class App : Application
          {
              public App() { InitializeComponent(); }
              protected override void OnLaunched(LaunchActivatedEventArgs args)
              {
                  var w = new Window();
                  w.Title = "BlankTest";
                  w.Content = new TextBlock { Text = "hello" };
                  try
                  {
                      var iconPath = System.IO.Path.Combine(AppContext.BaseDirectory, "Assets", "taosearch.ico");
                      System.Console.WriteLine("icon exists: " + System.IO.File.Exists(iconPath));
                      w.AppWindow.SetIcon(iconPath);
                      System.Console.WriteLine("SetIcon done");
                  }
                  catch (System.Exception ex)
                  {
                      System.Console.WriteLine("SetIcon异常: " + ex.Message);
                  }
                  w.Activate();
              }
          }
          '@
          [System.IO.File]::WriteAllText("$dir/App.xaml.cs", $cs, (New-Object System.Text.UTF8Encoding($false)))
          $proj = ([System.IO.File]::ReadAllText("blank-app/template.csproj.txt") -f "<ApplicationIcon>Assets\taosearch.ico</ApplicationIcon>", "<ItemGroup>`r`n            <Content Include=`"Assets\taosearch.ico`">`r`n              <CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory>`r`n            </Content>`r`n          </ItemGroup>")
          [System.IO.File]::WriteAllText("$dir/Blank.csproj", $proj, (New-Object System.Text.UTF8Encoding($false)))
          dotnet publish "$dir/Blank.csproj" -c Release -r win-x64 --self-contained false -o blank-f-out --nologo
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::变体F发布失败"; exit 1 }
          $p = Start-Process -FilePath "blank-f-out/Blank.exe" -WorkingDirectory "blank-f-out" -PassThru
          Start-Sleep -Seconds 10
          $alive = Get-Process -Name "Blank" -ErrorAction SilentlyContinue
          if ($alive) {
            $w = $alive | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            Write-Host "变体F: 进程存活, 窗口标题='$(if($w){$w.MainWindowTitle}else{''})'"
            Stop-Process -Name "Blank" -Force -ErrorAction SilentlyContinue
          } else { try { Write-Host ("变体F: 进程已退出, 退出码=" + $p.ExitCode) } catch { Write-Host "变体F: 进程已退出" } }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object {
            $msg = if ($_.Message) { ($_.Message -replace "\s+", " ") } else { "(无正文)" }
            if ($msg.Length -gt 300) { $msg = $msg.Substring(0, 300) }
            Write-Host ("  F事件[" + $_.TimeCreated.ToString("HH:mm:ss") + "][" + $_.ProviderName + "] " + $msg)
          }

      - name: 变体G 真身 TaoSearch.App 去掉自定义清单发布
        shell: pwsh
