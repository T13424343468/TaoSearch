            Stop-Process -Name "Blank" -Force -ErrorAction SilentlyContinue
          } else { try { Write-Host ("变体H: 进程已退出, 退出码=" + $p.ExitCode) } catch { Write-Host "变体H: 进程已退出" } }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object {
            $msg = if ($_.Message) { ($_.Message -replace "\s+", " ") } else { "(无正文)" }
