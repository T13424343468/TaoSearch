          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object {
            $msg = if ($_.Message) { ($_.Message -replace "\s+", " ") } else { "(无正文)" }
            if ($msg.Length -gt 300) { $msg = $msg.Substring(0, 300) }
            Write-Host ("  K事件[" + $_.TimeCreated.ToString("HH:mm:ss") + "][" + $_.ProviderName + "] " + $msg)
          }
      - name: 变体L 真身 + 仅顶部区(搜索框/开关/状态行)
        shell: pwsh
        run: |
          Copy-Item -Recurse src real-src-l
          $mwXaml = @'
          <Window
              x:Class="TaoSearch.App.MainWindow"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
              Title="TaoSearch">
            <Grid Background="{ThemeResource PaperBrush}">
              <StackPanel Margin="16,12,16,8">
                <TextBox x:Name="SearchBox" PlaceholderText="输入文件名或内容关键词…" FontSize="{StaticResource FontBody}" CornerRadius="{StaticResource InputRadius}" TextChanged="OnSearchTextChanged" />
                <ToggleSwitch x:Name="ContentToggle" OnContent="含内容" OffContent="仅文件名" Toggled="OnScopeToggled" />
                <TextBlock x:Name="StatusText" Style="{StaticResource AuxText}" />
              </StackPanel>
            </Grid>
