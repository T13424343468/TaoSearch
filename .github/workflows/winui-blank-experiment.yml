          (Get-Content real-src/TaoSearch.App/TaoSearch.App.csproj -Raw) -replace '\s*<ApplicationManifest>app\.manifest</ApplicationManifest>', '' | Set-Content real-src/TaoSearch.App/TaoSearch.App.csproj -NoNewline
