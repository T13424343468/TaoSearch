      - name: 变体K 真身 + 完整构造但XAML去掉ListView数据模板(排除模板绑定)
        shell: pwsh
        run: |
          Copy-Item -Recurse src real-src-k
          # 把 ListView.ItemTemplate 整段替换为空模板引用，其余 XAML 不动
          $xaml = Get-Content real-src-k/TaoSearch.App/MainWindow.xaml -Raw
          $idx1 = $xaml.IndexOf("<ListView.ItemTemplate>")
          $idx2 = $xaml.IndexOf("</ListView.ItemTemplate>")
          if ($idx1 -ge 0 -and $idx2 -gt $idx1) {
            $xaml = $xaml.Substring(0, $idx1) + $xaml.Substring($idx2 + "</ListView.ItemTemplate>".Length)
            [System.IO.File]::WriteAllText("real-src-k/TaoSearch.App/MainWindow.xaml", $xaml, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "已移除 ItemTemplate"
          }
          dotnet publish real-src-k/TaoSearch.App/TaoSearch.App.csproj -c Release -r win-x64 --self-contained false -o real-k-out --nologo
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::变体K发布失败"; exit 1 }
