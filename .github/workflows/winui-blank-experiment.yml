name: winui-blank-experiment

on:
  workflow_dispatch:

jobs:
  blank-matrix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 生成空白 WinUI3 应用模板
        shell: pwsh
        run: |
          $dir = "blank-app"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $csproj = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net10.0-windows10.0.26100.0</TargetFramework>
              <TargetPlatformMinVersion>10.0.19041.0</TargetPlatformMinVersion>
              <SupportedOSPlatformVersion>10.0.19041.0</SupportedOSPlatformVersion>
              <UseWinUI>true</UseWinUI>
              <EnableMsixTooling>true</EnableMsixTooling>
              <WindowsPackageType>None</WindowsPackageType>
              <WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <Platforms>x64</Platforms>
              <RuntimeIdentifiers>win-x64</RuntimeIdentifiers>
              {0}
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.WindowsAppSDK" Version="1.8.260921001" />
              <PackageReference Include="Microsoft.Windows.SDK.BuildTools" Version="10.0.26100.4654" />
            </ItemGroup>
            {1}
          </Project>
          '@
          [System.IO.File]::WriteAllText("$dir/template.csproj.txt", $csproj, (New-Object System.Text.UTF8Encoding($false)))
          $appXaml = @'
          <Application
              x:Class="Blank.App"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">
            <Application.Resources>
              <ResourceDictionary>
                <ResourceDictionary.MergedDictionaries>
                  <XamlControlsResources xmlns="using:Microsoft.UI.Xaml.Controls" />
                </ResourceDictionary.MergedDictionaries>
              </ResourceDictionary>
            </Application.Resources>
          </Application>
          '@
          $appCs = @'
          using Microsoft.UI.Xaml;
          using Microsoft.UI.Xaml.Controls;

          namespace Blank;

          public partial class App : Application
          {{
              public App() {{ InitializeComponent(); }}
              protected override void OnLaunched(LaunchActivatedEventArgs args)
              {{
                  var w = new Window();
                  w.Title = "BlankTest";
                  w.Content = new TextBlock {{ Text = "hello" }};
                  {0}
                  w.Activate();
              }}
          }}
          '@
          [System.IO.File]::WriteAllText("$dir/template-appcs.txt", $appCs, (New-Object System.Text.UTF8Encoding($false)))
          [System.IO.File]::WriteAllText("$dir/App.xaml", $appXaml, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "模板已生成"

      - name: 变体D 空白应用 + TaoSearch 的 app.manifest
        shell: pwsh
        run: |
          $dir = "blank-d"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item blank-app/App.xaml "$dir/App.xaml"
          Copy-Item src/TaoSearch.App/app.manifest "$dir/app.manifest"
          $cs = [System.IO.File]::ReadAllText("blank-app/template-appcs.txt") -f ""
          [System.IO.File]::WriteAllText("$dir/App.xaml.cs", $cs, (New-Object System.Text.UTF8Encoding($false)))
          $proj = ([System.IO.File]::ReadAllText("blank-app/template.csproj.txt") -f "<ApplicationManifest>app.manifest</ApplicationManifest>", "")
          [System.IO.File]::WriteAllText("$dir/Blank.csproj", $proj, (New-Object System.Text.UTF8Encoding($false)))
          dotnet publish "$dir/Blank.csproj" -c Release -r win-x64 --self-contained false -o blank-d-out --nologo
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::变体D发布失败"; exit 1 }
          $p = Start-Process -FilePath "blank-d-out/Blank.exe" -WorkingDirectory "blank-d-out" -PassThru
          Start-Sleep -Seconds 10
          $alive = Get-Process -Name "Blank" -ErrorAction SilentlyContinue
          if ($alive) {
            $w = $alive | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            Write-Host "变体D: 进程存活, 窗口标题='$(if($w){$w.MainWindowTitle}else{''})'"
            Stop-Process -Name "Blank" -Force -ErrorAction SilentlyContinue
          } else { try { Write-Host ("变体D: 进程已退出, 退出码=" + $p.ExitCode) } catch { Write-Host "变体D: 进程已退出" } }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object {
            $msg = if ($_.Message) { ($_.Message -replace "\s+", " ") } else { "(无正文)" }
            if ($msg.Length -gt 300) { $msg = $msg.Substring(0, 300) }
            Write-Host ("  D事件[" + $_.TimeCreated.ToString("HH:mm:ss") + "][" + $_.ProviderName + "] " + $msg)
          }

      - name: 变体E 空白应用 + zh-CN 默认语言
        shell: pwsh
