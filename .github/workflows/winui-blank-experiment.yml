      - name: 变体I 真身 + 最小主窗(排除MainWindow内容)
        shell: pwsh
        run: |
          Copy-Item -Recurse src real-src-i
          $mwXaml = @'
          <Window
              x:Class="TaoSearch.App.MainWindow"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
              Title="TaoSearch">
            <Grid>
              <TextBlock Text="minimal" />
            </Grid>
          </Window>
          '@
          [System.IO.File]::WriteAllText("real-src-i/TaoSearch.App/MainWindow.xaml", $mwXaml, (New-Object System.Text.UTF8Encoding($false)))
